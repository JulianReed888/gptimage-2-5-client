[package]
name = "gptimage-2-5-client"
version = "0.1.0"
edition = "2021"
description = "Typed Rust primitives for describing GPT Image 2.5 prompts, generation settings, and reference-image metadata."
license = "MIT"
readme = "README.md"
homepage = "https://gptimage-2-5.com"
repository = "https://github.com/JulianReed888/gptimage-2-5-client"
documentation = "https://docs.rs/gptimage-2-5-client"
keywords = ["ai", "image", "generator", "prompt", "client"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
